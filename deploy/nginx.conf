# Production site config for zf.overloader.site.
# Certbot manages listen/ssl/redirect lines. Do not copy this file over an
# already-issued site blindly; merge the location blocks instead.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name zf.overloader.site;

    client_max_body_size 2m;
    keepalive_timeout 65s;

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zf.overloader.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zf.overloader.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = zf.overloader.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name zf.overloader.site;
    return 404; # managed by Certbot
}
